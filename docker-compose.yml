services:
  calculator-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: harsh9163/calculator-api:latest
    container_name: calculator-api
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    expose:
      - "8080"
    networks:
      - calculator-net

  nginx:
    image: nginx:alpine
    container_name: calculator-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calculator-api:
        condition: service_healthy
    networks:
      - calculator-net

networks:
  calculator-net:
    driver: bridge
