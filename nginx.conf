upstream calculator-backend {
    server calculator-api:8080;
}

server {
    listen 80;
    server_name localhost;

    # Proxy all incoming traffic to the Calculator REST API
    location / {
        proxy_pass http://calculator-backend;
        proxy_http_version 1.1;

        # Forward standard client headers for logging and security
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy connection and response timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
